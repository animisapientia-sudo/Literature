<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jane Austen, «Persuasion»: an interactive workshop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d3557;--navy2:#2b4a73;--sea:#3f8f8a;--sea2:#d8ecea;--rose:#c4666a;--rose2:#f6e3e1;--gold:#c9a356;--cream:#fbf8f2;--ink:#22252b;--muted:#5f6670;--line:#d5dbe2}
*{box-sizing:border-box}
body{margin:0;font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.5;color:var(--ink);background:#eef2f5}
.top{background:var(--navy);color:#f3efe6;text-align:center;padding:20px 16px 34px;position:relative;overflow:hidden}
.top:after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;background:radial-gradient(circle at 12px -6px,transparent 16px,#eef2f5 17px) 0 0/24px 22px repeat-x}
.top .k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.top h1{font-family:'Playfair Display',Georgia,serif;font-size:34px;margin:6px 0 2px;font-weight:700}
.top .s{font-style:italic;opacity:.85;font-size:17px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;position:sticky;top:0;z-index:5;background:#eef2f5ee;backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
.tabs button{font-family:'Playfair Display',serif;font-size:14px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:5px 13px;cursor:pointer}
.tabs button.cur{background:var(--navy);color:#fff}
.tabs button.done:not(.cur){border-color:var(--sea);background:var(--sea2)}
.wrap{max-width:840px;margin:20px auto 40px;padding:0 14px}
.page{background:var(--cream);border-radius:10px;padding:30px 32px;box-shadow:0 1px 0 var(--line),0 18px 40px #1d355718;border-top:6px solid var(--sea)}
.num{font-family:'Playfair Display',serif;color:var(--rose);font-size:14px;letter-spacing:.15em;text-transform:uppercase}
h2{font-family:'Playfair Display',serif;font-size:29px;margin:4px 0 2px;color:var(--navy);line-height:1.2}
.h2ua{font-style:italic;color:var(--muted);margin:0 0 14px;font-size:17px}
.task{background:#fff;border-left:4px solid var(--gold);border-radius:0 6px 6px 0;padding:12px 16px;margin:0 0 18px}
.task p{margin:0}
.task .ua,.ua{color:var(--muted);font-style:italic;font-size:16.5px;margin-top:6px}
label.q{display:block;font-weight:600;margin:16px 0 4px;color:var(--navy)}
label.q .ua{display:block;font-weight:400;margin-top:0}
textarea,input[type=text]{width:100%;font-family:'EB Garamond',serif;font-size:18px;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);resize:vertical}
textarea{min-height:70px}
textarea:focus,input:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px #3f8f8a22}
.btns{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:center}
.btn{font-family:'Playfair Display',serif;font-size:16px;padding:9px 22px;border-radius:24px;border:none;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sea{background:var(--sea)}
/* portraits */
.card{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card.right{border-color:var(--sea);box-shadow:inset 4px 0 0 var(--sea)}
.card.wrong{border-color:var(--rose);box-shadow:inset 4px 0 0 var(--rose)}
blockquote{margin:0 0 4px;font-style:italic;font-size:20px;color:var(--navy);line-height:1.4}
blockquote:before{content:'“';color:var(--gold);font-size:30px;line-height:0;vertical-align:-10px;margin-right:2px}
.src{font-size:14px;color:var(--muted);margin-bottom:8px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
select{font-family:'EB Garamond',serif;font-size:17px;padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
select.filled{border-color:var(--sea);background:var(--sea2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{font-family:'EB Garamond',serif;font-size:15px;padding:2px 11px;border-radius:14px;border:1px solid var(--line);background:#f7f9fb;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mark{font-weight:700}
.mark.ok{color:var(--sea)}.mark.no{color:var(--rose)}
/* graph */
.graph{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px;margin:0 0 16px}
.graph svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;justify-content:center;font-size:15px;margin-top:4px}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.stage{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.stage .sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stage .sn{font-family:'Playfair Display',serif;font-weight:700;color:var(--rose);font-size:20px}
.stage .st{font-weight:600;color:var(--navy);font-size:19px}
.stage .sc{font-size:15px;color:var(--muted);font-style:italic}
.sl{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:15px}
.sl input{width:100%}
.sl .v{font-weight:700;text-align:center}
.sl.b input{accent-color:var(--rose)}.sl.b .v{color:var(--rose)}
.sl.vo input{accent-color:var(--navy)}.sl.vo .v{color:var(--navy)}
.unset{font-size:13px;color:var(--rose)}
/* wentworth */
.ol{list-style:none;padding:0;margin:0}
.ol li{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.ol .h{display:flex;gap:10px;align-items:center}
.ol .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:700}
.ol .t{flex:1;font-weight:500}
.ol .arr button{width:32px;height:28px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;color:var(--navy)}
.ol .arr button:disabled{opacity:.3}
.temp{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.temp button{font-family:'EB Garamond',serif;font-size:15px;padding:3px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.ol input[type=text]{font-size:17px}
.thermo{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 16px;border:1px solid var(--line)}
.thermo div{flex:1}
/* letter */
.paper{background:#fffdf7;border:1px solid #e4d9bf;border-radius:4px;padding:22px 26px;box-shadow:0 3px 12px #0001;font-size:19px;line-height:1.75}
.paper .sent{cursor:pointer;border-radius:3px;padding:1px 2px;transition:background .15s}
.paper .sent:hover{outline:1px dashed var(--muted)}
.brushes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;position:sticky;top:56px;z-index:3;background:var(--cream);padding:6px 0}
.brushes button{font-family:'EB Garamond',serif;font-size:15px;padding:5px 12px;border-radius:16px;border:2px solid transparent;cursor:pointer;color:var(--ink)}
.brushes button.on{border-color:var(--ink);font-weight:600}
.brushes small{opacity:.75}
/* map */
.pmap{display:grid;grid-template-columns:110px 1fr 1fr;gap:6px;margin:6px 0 18px}
.pmap .hd{font-family:'Playfair Display',serif;font-size:14px;text-align:center;padding:6px;border-radius:6px;color:#fff}
.pmap .rl{font-family:'Playfair Display',serif;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:6px;color:#fff;padding:6px}
.pmap .cell{min-height:86px;border:1.5px dashed var(--line);border-radius:6px;background:#fff;padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.pmap .cell span{background:var(--navy);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:15px}
.pcard{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.pcard .h{display:flex;gap:10px;align-items:flex-start}
.pcard .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.qbtns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px 38px}
.qbtns button{font-family:'EB Garamond',serif;font-size:14px;padding:3px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.qbtns button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.pcard input{margin-left:38px;width:calc(100% - 38px);font-size:17px}
.titles{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.titles button{font-family:'Playfair Display',serif;font-size:17px;padding:8px 16px;border-radius:6px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.titles button.on{background:var(--navy);color:#fff}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.sum div{border:1.5px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:15px;background:#fff}
.sum div.ok{border-color:var(--sea);background:var(--sea2)}
.note{background:var(--rose2);border-left:4px solid var(--rose);padding:10px 14px;font-size:16px;margin:12px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media(max-width:600px){body{font-size:18px}.page{padding:22px 16px}h2{font-size:24px}.top h1{font-size:27px}.sl{grid-template-columns:90px 1fr 30px}.pmap{grid-template-columns:70px 1fr 1fr}.pmap .rl,.pmap .hd{font-size:12px}.qbtns{margin-left:0}.pcard input{margin-left:0;width:100%}.brushes{top:96px}}
</style>
</head>
<body>
<header class="top">
  <div class="k">An interactive reading workshop · Інтерактивний практикум</div>
  <h1>Jane Austen, <i>Persuasion</i> (1817)</h1>
  <div class="s">5 tasks on character, change and the meaning of the title</div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap"><main class="page" id="page"></main></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KEY='austen_persuasion_workshop_v1';
var S;try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
S=S||{p:0,a:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function A(k,d){return S.a[k]!==undefined?S.a[k]:d}
function filled(k){var v=S.a[k];return typeof v==='string'&&v.trim().length>2}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}

/* ================= DATA ================= */
var WHO=[{id:'sw',t:'Sir Walter Elliot'},{id:'el',t:'Elizabeth Elliot'},{id:'an',t:'Anne Elliot'},{id:'ma',t:'Mary Musgrove'},{id:'mm',t:'Mrs Musgrove'},{id:'we',t:'Mr William Elliot'}];
var TECH=['narrator’s ironic comment','free indirect discourse','self-revealing speech','another character’s view','understatement / contrast'];
var PORTRAITS=[
 {id:'a',q:'Vanity was the beginning and the end of Sir Walter Elliot’s character; vanity of person and of situation.',src:'Chapter 1',ans:'sw',hide:'Sir Walter Elliot'},
 {id:'b',q:'…her word had no weight, her convenience was always to give way — she was only Anne.',src:'Chapter 1',ans:'an',hide:'Anne'},
 {id:'c',q:'I am so ill I can hardly speak. I have not seen a creature the whole morning!',src:'Chapter 5',ans:'ma'},
 {id:'d',q:'Such a number of looking-glasses! oh Lord! there was no getting away from oneself.',src:'Chapter 13 (Admiral Croft speaking about the dressing-room at Kellynch)',ans:'sw'},
 {id:'e',q:'…being very handsome, and very like himself, her influence had always been great, and they had gone on together most happily.',src:'Chapter 1',ans:'el'},
 {id:'f',q:'…a man without heart or conscience; a designing, wary, cold-blooded being, who thinks only of himself.',src:'Chapter 21 (Mrs Smith speaking)',ans:'we'},
 {id:'g',q:'Personal size and mental sorrow have certainly no necessary proportions.',src:'Chapter 8 (on the grief for “poor Richard”)',ans:'mm'}
];
PORTRAITS.forEach(function(p){if(p.hide)p.q=p.q.replace(p.hide,'_____')});

var STAGES=[
 {id:'s1',t:'Kellynch Hall',sc:'Ch. 1–4: “only Anne”; the family’s debts and the letting of Kellynch'},
 {id:'s2',t:'Uppercross',sc:'Ch. 5–8: Wentworth returns; “so altered”'},
 {id:'s3',t:'The walk to Winthrop',sc:'Ch. 9–10: little Walter; the hazel-nut speech; the Crofts’ gig'},
 {id:'s4',t:'Lyme',sc:'Ch. 11–12: Captain Benwick; Mr Elliot’s look; Louisa’s fall on the Cobb'},
 {id:'s5',t:'Bath',sc:'Ch. 13–22: Mr Elliot’s attentions; Mrs Smith; the concert'},
 {id:'s6',t:'The White Hart',sc:'Ch. 23–24: the talk with Harville; the letter; the gravel walk'}
];

var WENT=[
 {id:'w5',t:'After Louisa’s fall he says there is “no one so proper, so capable as Anne”.',ch:'Ch. 12'},
 {id:'w2',t:'He silently lifts little Walter off Anne’s back.',ch:'Ch. 9'},
 {id:'w7',t:'He writes a letter to Anne at the White Hart inn.',ch:'Ch. 23'},
 {id:'w1',t:'He says Anne is “so altered he should not have known her again”.',ch:'Ch. 7'},
 {id:'w4',t:'He makes the Crofts take the tired Anne home in their gig.',ch:'Ch. 10'},
 {id:'w6',t:'At the concert he leaves abruptly when Mr Elliot claims Anne’s attention.',ch:'Ch. 20'},
 {id:'w3',t:'He praises Louisa’s firmness in the hazel-nut speech.',ch:'Ch. 10'}
];
var TEMPS=[{id:'t1',t:'cold resentment',c:'#3d6aa8'},{id:'t2',t:'wounded pride',c:'#6f8fb7'},{id:'t3',t:'hidden care',c:'#c9a356'},{id:'t4',t:'jealousy',c:'#d0876a'},{id:'t5',t:'open love',c:'#c4666a'}];

var LETTER=['I can listen no longer in silence.','I must speak to you by such means as are within my reach.','You pierce my soul.','I am half agony, half hope.','Tell me not that I am too late, that such precious feelings are gone for ever.','I offer myself to you again with a heart even more your own than when you almost broke it, eight years and a half ago.','Dare not say that man forgets sooner than woman, that his love has an earlier death.','I have loved none but you.','Unjust I may have been, weak and resentful I have been, but never inconstant.','You alone have brought me to Bath.','For you alone, I think and plan.','Have you not seen this?','Can you fail to have understood my wishes?','I had not waited even these ten days, could I have read your feelings, as I think you must have penetrated mine.','I can hardly write.','I am every instant hearing something which overpowers me.','You sink your voice, but I can distinguish the tones of that voice when they would be lost on others.','Too good, too excellent creature!','You do justice to us, indeed.','You do believe that there is true attachment and constancy among men.','Believe it to be most fervent, most undeviating, in F. W.'];
var BRUSH=[{id:'h',t:'Agony & hope',ua:'біль і надія',c:'#f2c6c2'},{id:'f',t:'Confession of faults',ua:'визнання провини',c:'#f3dc9c'},{id:'c',t:'Constancy',ua:'вірність',c:'#bfe0da'},{id:'r',t:'Answer to Anne’s words',ua:'відповідь на слова Анни',c:'#c9d6ee'}];

var PCARDS=[
 {id:'p1',t:'At nineteen Anne breaks off her engagement to Wentworth, persuaded by Lady Russell.'},
 {id:'p2',t:'Anne refuses Charles Musgrove, although Lady Russell would have welcomed the match.'},
 {id:'p3',t:'Sir Walter is talked into retrenching, leaving Kellynch and letting it to Admiral Croft.'},
 {id:'p4',t:'Louisa urges Henrietta not to give up her visit to Charles Hayter at Winthrop.'},
 {id:'p5',t:'Louisa will not be talked out of jumping down the steps of the Cobb a second time.'},
 {id:'p6',t:'Anne advises Captain Benwick to read more prose; he promises to look for the books.'},
 {id:'p7',t:'Lady Russell encourages Anne to think of Mr Elliot as a husband.'},
 {id:'p8',t:'Mrs Smith’s story and evidence change Anne’s opinion of Mr Elliot.'}
];
var QUADS=[{id:'yh',t:'Yielded → happiness'},{id:'ys',t:'Yielded → suffering'},{id:'rh',t:'Resisted → happiness'},{id:'rs',t:'Resisted → suffering'}];

var PAGES=[
 {t:'Start',r:pIntro},
 {t:'1 · Portraits',r:p1},
 {t:'2 · Anne’s bloom',r:p2},
 {t:'3 · Wentworth',r:p3},
 {t:'4 · The letter',r:p4},
 {t:'5 · Persuasion',r:p5},
 {t:'Save',r:pEnd}
];

/* ================= SHELL ================= */
function done(i){
 switch(i){
  case 1:return PORTRAITS.every(function(p){return S.a['who_'+p.id]&&(S.a['tech_'+p.id]||[]).length&&filled('rv_'+p.id)})&&filled('p1_final');
  case 2:return STAGES.every(function(s){return S.a['bl_'+s.id]!==undefined&&S.a['vo_'+s.id]!==undefined&&filled('pr_'+s.id)})&&filled('p2_final');
  case 3:return !!S.a.w_touched&&WENT.every(function(w){return S.a['tp_'+w.id]&&filled('ws_'+w.id)})&&filled('p3_final');
  case 4:var m=S.a.marks||{};return Object.keys(m).length>=6&&filled('l_turn')&&filled('l_reply');
  case 5:return PCARDS.every(function(c){return S.a['q_'+c.id]})&&filled('p5_why')&&S.a.right!==undefined&&filled('p5_right')&&S.a.title&&filled('p5_title');
 }return false;
}
function tabs(){var t=document.getElementById('tabs');t.innerHTML=PAGES.map(function(p,i){return '<button data-i="'+i+'" class="'+(i===S.p?'cur ':'')+(done(i)?'done':'')+'">'+p.t+'</button>'}).join('');t.querySelectorAll('button').forEach(function(b){b.onclick=function(){go(+b.dataset.i)}})}
function tabsLight(){document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('done',done(+b.dataset.i))})}
function go(i){S.p=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){var el=document.getElementById('page');el.innerHTML=PAGES[S.p].r();bind(el);tabs()}
function rerender(){var y=window.scrollY;var el=document.getElementById('page');el.innerHTML=PAGES[S.p].r();bind(el);tabs();window.scrollTo(0,y)}
function bind(el){
 el.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(+b.dataset.go)}});
 el.querySelectorAll('[data-k]').forEach(function(f){f.addEventListener('input',function(){S.a[f.dataset.k]=f.value;save();tabsLight()})});
 if(PAGES[S.p].after)PAGES[S.p].after(el);
}
function nav(){return '<div class="btns"><button class="btn ghost" data-go="'+(S.p-1)+'">← Back</button><button class="btn" data-go="'+(S.p+1)+'">Next →</button></div>'}
function ta(k,ph,rows){return '<textarea data-k="'+k+'" rows="'+(rows||3)+'" placeholder="'+esc(ph||'')+'">'+esc(A(k,''))+'</textarea>'}
function inp(k,ph){return '<input type="text" data-k="'+k+'" placeholder="'+esc(ph||'')+'" value="'+esc(A(k,''))+'">'}
function head(n,en,ua){return '<div class="num">'+n+'</div><h2>'+en+'</h2><p class="h2ua">'+ua+'</p>'}
function task(en,ua){return '<div class="task"><p>'+en+'</p><p class="ua">'+ua+'</p></div>'}
function q(en,ua){return '<label class="q">'+en+'<span class="ua">'+ua+'</span></label>'}

/* ================= PAGES ================= */
function pIntro(){
 return head('Before you begin','Welcome aboard!','Ласкаво просимо на борт!')+
 q('Full name','Прізвище та ім’я')+inp('name','')+
 q('Group','Група')+inp('group','')+
 task('This is not a test: there are no single “right buttons”. Show how closely you have read the novel. Answer <b>in English</b> and support every answer with an episode, a line or a detail from the text. Your answers are saved automatically in this browser. When you finish, open the <b>Save</b> tab and download your work as a Word file.',
      'Це не тест: тут немає єдиних «правильних кнопок». Покажи, наскільки уважно ти прочитав(-ла) роман. Відповідай <b>англійською</b> й підкріплюй кожну відповідь епізодом, реплікою чи деталлю з тексту. Відповіді автоматично зберігаються в цьому браузері. Наприкінці відкрий вкладку <b>Save</b> і завантаж свою роботу у файлі Word.')+
 '<div class="btns"><span></span><button class="btn" data-go="1">Start →</button></div>';
}

/* ---- 1 Portraits ---- */
function p1(){
 var chk=!!S.a.checked;
 var h=head('Task 1','The Portrait Gallery','Портретна галерея')+
  task('Austen often reveals a character in a single sentence. For each quotation: (1) choose <b>who is portrayed</b>; (2) mark <b>one or two techniques</b> Austen uses; (3) write in a few words <b>what the line reveals</b>. Then press “Check who’s who”.',
       'Остін часто розкриває персонажа одним реченням. Для кожної цитати: (1) обери, <b>кого змальовано</b>; (2) познач <b>один-два прийоми</b>, які використовує авторка; (3) коротко напиши, <b>що розкриває ця фраза</b>. Потім натисни «Check who’s who».');
 PORTRAITS.forEach(function(p,i){
  var w=A('who_'+p.id,''),tc=S.a['tech_'+p.id]||[],cls='';
  if(chk&&w)cls=w===p.ans?' right':' wrong';

function download(){
 var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Persuasion</title><style>body{font-family:"Times New Roman";font-size:13pt;line-height:1.4}h1{font-size:16pt;text-align:center}h2{font-size:14pt;color:#1d3557;margin-top:18pt}p.q{font-weight:bold;margin:8pt 0 2pt}p.a{margin:0 0 6pt 14pt}</style></head><body>';
 collect().forEach(function(x){if(x.title)html+='<h1>'+esc(x.title)+'</h1>';else if(x.h)html+='<h2>'+esc(x.h)+'</h2>';else html+='<p class="q">'+esc(x.q)+'</p><p class="a">'+esc(x.a).replace(/\n/g,'<br>')+'</p>'});
 html+='</body></html>';
 var blob=new Blob(['﻿',html],{type:'application/msword'});
 var nm=(S.a.name||'student').trim().replace(/[^\wА-Яа-яІіЇїЄєҐґ\- ]/g,'').replace(/\s+/g,'_');
 var l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='Persuasion_workshop_'+nm+'.doc';document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(l.href);l.remove()},500);
 toast('File downloaded / Файл завантажено');
}
function copyAll(){
 var t=collect().map(function(x){return x.title?x.title:x.h?'\n'+x.h.toUpperCase():x.q+'\n'+x.a}).join('\n');
 function fb(){var e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('Copied / Скопійовано')}catch(er){toast('Copy failed')}e.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Copied / Скопійовано')},fb);else fb();
}
render();
})();
</script>
</body>
</html>
