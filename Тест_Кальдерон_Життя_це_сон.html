    case 'order':return !!(a&&a.touched);
    case 'tf':return !!a&&q.items.every(function(i){return typeof a[i.id]==='boolean';});
    case 'match':return !!a&&q.left.every(function(i){return !!a[i.id];});
    case 'sort':return !!a&&q.items.every(function(i){return !!a[i.id];});
    case 'gaps':return !!a&&['g1','g2','g3','g4','g5'].every(function(g){return !!a[g];});
  }
  return false;
}

/* ---------- rendering ---------- */
function render(){
  if(state.submitted){renderResult();pager.innerHTML='';return;}
  if(state.page===0){renderIntro();pager.innerHTML='';return;}
  if(state.page===Q.length+1){renderFinish();renderPager();return;}
  renderQuestion(Q[state.page-1]);renderPager();
}

function renderPager(){
  var h='';
  Q.forEach(function(q,i){
    var cls=(state.page===i+1?'cur ':'')+(isAnswered(q)?'done':'');
    h+='<button class="'+cls+'" data-go="'+(i+1)+'" title="Завдання '+(i+1)+'">'+(i+1)+'</button>';
  });
  h+='<button class="fin '+(state.page===Q.length+1?'cur':'')+'" data-go="'+(Q.length+1)+'">Завершення</button>';
  pager.innerHTML=h;
  pager.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(+b.getAttribute('data-go'));};});
}
function go(p){state.page=p;save();render();window.scrollTo({top:0,behavior:'smooth'});}

function renderIntro(){
  app.innerHTML=
   '<div class="qnum">Перед початком</div>'+
   '<h2 class="q">Вітаю! Вкажи свої дані</h2>'+
   '<div class="field"><label for="nm">Прізвище та ім’я</label><input id="nm" autocomplete="name" value="'+esc(state.name)+'"></div>'+
   '<div class="field"><label for="gr">Група</label><input id="gr" value="'+esc(state.group)+'"></div>'+
   '<ul class="rules">'+
    '<li>У тесті 10 завдань різних типів; кожне на окремій сторінці.</li>'+
    '<li>До здачі можна переходити між завданнями кнопками або номерами внизу.</li>'+
    '<li>Відповіді зберігаються автоматично.</li>'+
    '<li><b>Пройти тест можна лише один раз.</b> Після здачі побачиш свій бал — зроби скриншот і надішли викладачці.</li>'+
   '</ul>'+
   '<div class="btns" style="justify-content:flex-end"><button class="btn" id="start" disabled>Розпочати тест →</button></div>';
  var nm=document.getElementById('nm'),gr=document.getElementById('gr'),st=document.getElementById('start');
  function chk(){st.disabled=!(nm.value.trim().length>2&&gr.value.trim().length>0);}
  nm.oninput=gr.oninput=chk;chk();
  st.onclick=function(){state.name=nm.value.trim();state.group=gr.value.trim();if(!state.startedAt)state.startedAt=new Date().toISOString();go(1);};
}

function head(q,idx){
  return '<div class="qnum">Завдання '+idx+' з '+Q.length+'<span class="qtype">'+q.label+'</span></div>'+
         '<h2 class="q">'+esc(q.text)+'</h2>'+(q.hint?'<p class="hint">'+esc(q.hint)+'</p>':'<p class="hint"></p>');
}
function navBtns(idx){
  return '<div class="btns"><button class="btn ghost" id="prev">← Назад</button>'+
         '<button class="btn" id="next">'+(idx===Q.length?'До завершення →':'Далі →')+'</button></div>';
}
function bindNav(idx){
  document.getElementById('prev').onclick=function(){go(idx-1);};
  document.getElementById('next').onclick=function(){go(idx+1);};
  if(idx===1){document.getElementById('prev').style.visibility='hidden';}
}
function setA(qid,v){state.answers[qid]=v;save();renderPager();}

function renderQuestion(q){
  var idx=state.page,h=head(q,idx),a=state.answers[q.id];
  if(q.type==='mc'){
    h+='<div class="opts">'+q.options.map(function(o,i){
      return '<button class="opt'+(a===o.id?' sel':'')+'" data-v="'+o.id+'"><span class="let">'+'АБВГ'[i]+'</span><span>'+esc(o.t)+'</span></button>';
    }).join('')+'</div>';
  }
  if(q.type==='tf'){
    a=a||{};
    h+='<div>'+q.items.map(function(it){
      return '<div class="row"><div class="txt">'+esc(it.t)+'</div><div class="seg" data-i="'+it.id+'">'+
        '<button data-v="1" class="'+(a[it.id]===true?'on':'')+'">Так</button>'+
        '<button data-v="0" class="'+(a[it.id]===false?'on alt':'')+'">Ні</button></div></div>';
    }).join('')+'</div>';
  }
  if(q.type==='match'){
    a=a||{};
    h+='<div class="match">'+q.left.map(function(l){
      return '<div class="row"><div class="who">'+esc(l.t)+'</div><select data-i="'+l.id+'" class="'+(a[l.id]?'filled':'')+'"><option value="">— обери характеристику —</option>'+
        q.right.map(function(r){return '<option value="'+r.id+'"'+(a[l.id]===r.id?' selected':'')+'>'+esc(r.t)+'</option>';}).join('')+'</select></div>';
    }).join('')+'</div>';
  }
  if(q.type==='order'){
    var ord=(a&&a.list)||q.items.map(function(i){return i.id;});
    var map={};q.items.forEach(function(i){map[i.id]=i.t;});
    h+='<div class="order"><ol>'+ord.map(function(id,i){
      return '<li><span class="n">'+(i+1)+'</span><span class="t">'+esc(map[id])+'</span><span class="arr">'+
        '<button data-up="'+i+'" '+(i===0?'disabled':'')+' aria-label="Вгору">▲</button>'+
        '<button data-dn="'+i+'" '+(i===ord.length-1?'disabled':'')+' aria-label="Вниз">▼</button></span></li>';
    }).join('')+'</ol></div>';
  }
  if(q.type==='gaps'){
    a=a||{};
    h+='<div class="gaps">'+q.parts.map(function(p){
      if(typeof p==='string')return esc(p);
      return '<select data-g="'+p.g+'" class="'+(a[p.g]?'filled':'')+'"><option value="">…</option>'+q.opts[p.g].map(function(o){return '<option'+(a[p.g]===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
    }).join('')+'</div>';
  }
  if(q.type==='sort'){
    a=a||{};
    h+='<div>'+q.items.map(function(it){
      return '<div class="row"><div class="txt">'+esc(it.t)+'</div><div class="seg" data-i="'+it.id+'">'+
        q.cats.map(function(c,ci){return '<button data-v="'+c.id+'" class="'+(a[it.id]===c.id?'on'+(ci?' alt':''):'')+'">'+esc(c.t)+'</button>';}).join('')+
        '</div></div>';
    }).join('')+'</div>';
  }
  if(q.type==='text'){
    h+='<div class="textans"><input id="ta" autocomplete="off" placeholder="Твоя відповідь" value="'+esc(a||'')+'"></div>';
  }
  h+=navBtns(idx);
  app.innerHTML=h;bindNav(idx);

  if(q.type==='mc'){app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){setA(q.id,b.getAttribute('data-v'));renderQuestion(q);};});}
  if(q.type==='tf'||q.type==='sort'){
    app.querySelectorAll('.seg').forEach(function(seg){
      seg.querySelectorAll('button').forEach(function(b){b.onclick=function(){
        var cur=Object.assign({},state.answers[q.id]||{});
        var v=b.getAttribute('data-v');
        cur[seg.getAttribute('data-i')]=q.type==='tf'?(v==='1'):v;
        setA(q.id,cur);renderQuestion(q);
      };});
    });
  }
  if(q.type==='match'){app.querySelectorAll('select').forEach(function(s){s.onchange=function(){var cur=Object.assign({},state.answers[q.id]||{});cur[s.getAttribute('data-i')]=s.value;setA(q.id,cur);s.className=s.value?'filled':'';};});}
  if(q.type==='gaps'){app.querySelectorAll('select').forEach(function(s){s.onchange=function(){var cur=Object.assign({},state.answers[q.id]||{});cur[s.getAttribute('data-g')]=s.value;setA(q.id,cur);s.className=s.value?'filled':'';};});}
  if(q.type==='order'){
    var list=((state.answers[q.id]&&state.answers[q.id].list)||q.items.map(function(i){return i.id;})).slice();
    function mv(i,j){var t=list[i];list[i]=list[j];list[j]=t;setA(q.id,{list:list,touched:true});renderQuestion(q);}
    app.querySelectorAll('[data-up]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-up');mv(i,i-1);};});
    app.querySelectorAll('[data-dn]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-dn');mv(i,i+1);};});
  }
  if(q.type==='text'){var ta=document.getElementById('ta');ta.oninput=function(){setA(q.id,ta.value);};ta.onkeydown=function(e){if(e.key==='Enter')go(idx+1);};}
}

function renderFinish(){
  var miss=Q.filter(function(q){return !isAnswered(q);});
  var h='<div class="qnum">Завершення</div><h2 class="q">Перевір, чи все готово</h2>'+
    '<div class="summary">'+Q.map(function(q,i){var ok=isAnswered(q);return '<div class="'+(ok?'ok':'no')+'">'+(i+1)+'<br>'+(ok?'✓':'—')+'</div>';}).join('')+'</div>';
  if(miss.length)h+='<div class="warn">Без відповіді або з неповною відповіддю: завдання '+miss.map(function(q){return Q.indexOf(q)+1;}).join(', ')+'. Порожні відповіді отримають 0 балів.</div>';
  else h+='<p>Усі завдання виконано. Після здачі змінити відповіді буде неможливо.</p>';
  h+='<div class="btns"><button class="btn ghost" id="prev">← Назад</button><button class="btn gold" id="submit">Здати тест</button></div>';
  app.innerHTML=h;
  document.getElementById('prev').onclick=function(){go(Q.length);};
  document.getElementById('submit').onclick=function(){
    document.getElementById('modalText').textContent=(miss.length?'Є завдання без повної відповіді ('+miss.length+'). ':'')+'Після підтвердження змінити відповіді й пройти тест повторно буде неможливо.';
    document.getElementById('modal').classList.add('show');
  };
}
document.getElementById('mNo').onclick=function(){document.getElementById('modal').classList.remove('show');};
document.getElementById('mYes').onclick=function(){document.getElementById('modal').classList.remove('show');submit();};

/* ---------- scoring ---------- */
function score(){
  var A=state.answers,s=0;
  Q.forEach(function(q){
    var a=A[q.id],p=0;
    if(q.type==='mc'){p=a&&H(q.id+'|'+a)===KEY[q.id]?1:0;}
    if(q.type==='tf'&&a){var c=0;q.items.forEach(function(i){if(typeof a[i.id]==='boolean'&&H(q.id+'|'+i.id+'|'+a[i.id])===KEY[q.id][i.id])c++;});p=c/q.items.length;}
    if(q.type==='match'&&a){var c2=0;q.left.forEach(function(l){if(a[l.id]&&H(q.id+'|'+l.id+'|'+a[l.id])===KEY[q.id][l.id])c2++;});p=c2/q.left.length;}
    if(q.type==='sort'&&a){var c3=0;q.items.forEach(function(i){if(a[i.id]&&H(q.id+'|'+i.id+'|'+a[i.id])===KEY[q.id][i.id])c3++;});p=c3/q.items.length;}
    if(q.type==='order'&&a&&a.touched){var c4=0;a.list.forEach(function(id,i){if(H(q.id+'|'+i+'|'+id)===KEY[q.id][i])c4++;});p=c4/a.list.length;}
    if(q.type==='gaps'&&a){var seen={},c5=0;['g1','g2','g3','g4'].forEach(function(g){var v=a[g];if(v&&!seen[v]&&KEY[q.id].set.indexOf(H(q.id+'|set|'+v))>-1){seen[v]=1;c5++;}});if(a.g5&&H(q.id+'|g5|'+a.g5)===KEY[q.id].g5)c5++;p=c5/5;}
    if(q.type==='text'){p=a&&KEY[q.id].indexOf(H(q.id+'|'+norm(a)))>-1?1:0;}
    s+=p;
  });
  return Math.round(s*10)/10;
}
function submit(){
  state.result=score();state.submitted=true;state.finishedAt=new Date().toISOString();save();render();window.scrollTo({top:0});
}

function fmt(iso){try{var d=new Date(iso);return d.toLocaleDateString('uk-UA')+' о '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function renderResult(){
  var r=state.result,pct=Math.round(r/Q.length*100);
  app.innerHTML='<div class="result center">'+
    '<div class="seal">VIDA<br>ES<br>SUEÑO</div>'+
    '<h2>Тест здано</h2>'+
    '<div class="score">'+String(r).replace('.',',')+'<small> / '+Q.length+'</small></div>'+
    '<div class="pct">'+pct+'%</div>'+
    '<div class="meta"><b>Студент(ка):</b><span>'+esc(state.name)+'</span><b>Група:</b><span>'+esc(state.group)+'</span><b>Розпочато:</b><span>'+fmt(state.startedAt)+'</span><b>Здано:</b><span>'+fmt(state.finishedAt)+'</span></div>'+
    '<div class="warn" style="text-align:left">📸 Зроби скриншот цього екрана й надішли викладачці. Повторне проходження тесту неможливе.</div>'+
  '</div>';
}

render();
})();
</script>
