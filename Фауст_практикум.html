<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>«Фауст» Й. В. Гете: інтерактивний практикум</title>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4ecd8;--paper2:#eadfc3;--ink:#1d1a14;--green:#1f3b2d;--green2:#2e5641;--blood:#8e1b1b;--amber:#c8862a;--line:#cbb98f;--muted:#6a5d47}
*{box-sizing:border-box}
body{margin:0;font-family:'Lora',Georgia,serif;color:var(--ink);font-size:17px;line-height:1.55;
 background:var(--paper2) repeating-linear-gradient(0deg,transparent 0 31px,#d6c7a222 31px 32px);}
.top{background:var(--green);color:#efe2bf;padding:18px 16px 14px;text-align:center;border-bottom:4px double var(--amber)}
.top .k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber)}
.top h1{font-family:'Old Standard TT',Georgia,serif;font-size:30px;margin:4px 0 2px;font-weight:700}
.top .s{font-style:italic;font-size:15px;opacity:.85}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px 10px;background:#e3d6b4;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs button{font-family:'Old Standard TT',serif;font-size:15px;border:1.5px solid var(--green);background:var(--paper);color:var(--green);border-radius:4px;padding:5px 11px;cursor:pointer}
.tabs button.cur{background:var(--green);color:#f4ecd8}
.tabs button.done:not(.cur){border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
.wrap{max-width:820px;margin:22px auto 40px;padding:0 14px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:28px 30px;box-shadow:0 2px 0 var(--line),0 14px 30px #0002;position:relative}
.page:before{content:'';position:absolute;inset:8px;border:1px solid #cbb98f88;pointer-events:none}
.num{font-family:'Old Standard TT',serif;color:var(--blood);font-size:14px;letter-spacing:.15em;text-transform:uppercase}
h2{font-family:'Old Standard TT',serif;font-size:28px;margin:4px 0 6px;color:var(--green);line-height:1.2}
.lead{font-style:italic;color:var(--muted);margin:0 0 16px}
.task{background:#fffaf0;border-left:4px solid var(--amber);padding:10px 14px;margin:0 0 16px;font-size:16px}
label.q{display:block;font-weight:600;margin:14px 0 6px;color:var(--green)}
textarea,input[type=text]{width:100%;font-family:'Lora',serif;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:#fffdf7;color:var(--ink);resize:vertical}
textarea{min-height:84px}
textarea:focus,input:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px #2e564122}
.btns{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{font-family:'Old Standard TT',serif;font-size:17px;padding:9px 20px;border-radius:4px;border:none;cursor:pointer;background:var(--green);color:#f4ecd8}
.btn:hover{background:var(--green2)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.red{background:var(--blood)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* shelf */
.shelf{display:flex;align-items:flex-end;gap:8px;padding:16px 14px 0;background:linear-gradient(#3a2a1a,#2a1d11);border-radius:4px 4px 0 0;border-bottom:12px solid #5a3d22;min-height:200px;justify-content:center;flex-wrap:wrap}
.book{width:74px;border-radius:3px 3px 0 0;cursor:pointer;color:#f2e2b8;font-family:'Old Standard TT',serif;font-size:14px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;padding:10px 0;border:1px solid #0004;box-shadow:inset -6px 0 0 #0002,inset 6px 0 0 #fff1;transition:.15s;text-align:center}
.book:hover{filter:brightness(1.15)}
.book.sel{outline:3px solid var(--amber);outline-offset:2px}
.book.ok:after{content:'✓';writing-mode:horizontal-tb;transform:rotate(180deg);margin-bottom:6px;color:var(--amber)}
.bookpanel{border:1.5px solid var(--line);border-top:none;padding:14px 16px;background:#fffaf0;border-radius:0 0 4px 4px}
/* order */
.ol{list-style:none;padding:0;margin:0}
.ol li{border:1.5px solid var(--line);background:#fffdf7;border-radius:4px;padding:10px 12px;margin-bottom:10px}
.ol .h{display:flex;align-items:center;gap:10px}
.ol .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--green);color:#f4ecd8;display:grid;place-items:center;font-family:'Old Standard TT',serif;font-weight:700}
.ol .t{flex:1;font-weight:600}
.ol .arr button{width:32px;height:28px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:var(--green)}
.ol .arr button:disabled{opacity:.3}
.ol textarea,.ol input{margin-top:8px;min-height:56px}
.word{font-family:'Old Standard TT',serif;font-size:22px;color:var(--blood)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 16px;font-size:13px}
.route span.st{background:var(--green);color:#f4ecd8;padding:3px 8px;border-radius:12px}
.route span.ar{color:var(--amber)}
/* wager table */
.grid2{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px;align-items:start}
.grid2 .hd{font-family:'Old Standard TT',serif;font-weight:700;color:var(--green);text-align:center;padding:6px;background:#e9dcb9;border-radius:4px}
.grid2 .rl{font-weight:600;font-size:15px;padding-top:8px;color:var(--muted)}
.grid2 textarea{min-height:64px}
.contract{margin-top:22px;padding:22px 24px;background:#fbf3df;border:2px solid #b79c63;border-radius:2px;box-shadow:inset 0 0 40px #c8a76533;font-family:'Old Standard TT',serif}
.contract h3{text-align:center;margin:0 0 10px;font-size:22px;letter-spacing:.08em}
.contract .sig{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.blood{font-family:'Old Standard TT',serif;font-style:italic;color:var(--blood);font-size:24px;border-bottom:1px solid var(--blood);min-width:200px;text-align:center;min-height:34px}
/* diary */
.entry{border:1.5px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:14px;background:#fffdf7;background-image:repeating-linear-gradient(transparent 0 27px,#e5d6b066 27px 28px)}
.entry select{font-family:inherit;font-size:16px;padding:6px 8px;border:1.5px solid var(--line);border-radius:4px;background:#fff;max-width:100%}
.entry textarea{background:transparent;min-height:110px}
/* court */
.def{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;margin-top:12px}
.def .who{font-family:'Old Standard TT',serif;font-weight:700;color:var(--green);font-size:18px}
.def input[type=range]{width:100%;accent-color:var(--blood)}
.def .v{font-weight:700;color:var(--blood);text-align:center;font-size:18px}
.def textarea{grid-column:1/-1;min-height:56px}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px;margin:18px 0 6px;padding:0 6px;border-bottom:2px solid var(--green)}
.bars div{flex:1;background:var(--blood);border-radius:3px 3px 0 0;transition:height .2s;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.verd{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.verd button{font-family:'Old Standard TT',serif;font-size:17px;padding:8px 16px;border:1.5px solid var(--green);background:#fffdf7;border-radius:4px;cursor:pointer;color:var(--green)}
.verd button.on{background:var(--green);color:#fff}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.sum div{border:1.5px solid var(--line);border-radius:4px;padding:8px;text-align:center;font-size:14px}
.sum div.ok{border-color:var(--green2);background:#e6efe8}
.note{background:#f6e7e2;border-left:4px solid var(--blood);padding:10px 14px;font-size:15px;margin:12px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:4px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.stage{border:1.5px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px;background:#fffdf7}
.stage .sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stage .sn{font-family:'Old Standard TT',serif;font-weight:700;color:var(--blood);font-size:18px}
.stage .st2{font-weight:600;color:var(--green)}
.stage .sc{font-size:14px;color:var(--muted);font-style:italic}
.soul{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin:10px 0 4px}
.soul input{width:100%;accent-color:var(--green2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-family:'Lora',serif;font-size:13px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--amber);border-color:var(--amber);color:#1d1a14;font-weight:600}
.graph{background:#fffdf7;border:1.5px solid var(--line);border-radius:4px;padding:8px;margin:6px 0 16px}
.graph svg{width:100%;height:auto;display:block}
.dos{display:grid;grid-template-columns:170px 1fr 1fr;gap:8px;align-items:start}
.dos .hd{font-family:'Old Standard TT',serif;font-weight:700;text-align:center;padding:8px;border-radius:4px;color:#f4ecd8}
.dos .rl{font-weight:600;font-size:15px;padding-top:8px;color:var(--muted)}
.dos textarea{min-height:60px}
.letter{margin-top:16px;padding:18px 20px;background:#fbf3df;border:1px solid #b79c63;font-family:'Old Standard TT',serif}
.letter textarea{background:transparent;min-height:150px;font-family:'Old Standard TT',serif;font-size:17px;border-style:dashed}
@media(max-width:600px){.dos .hd,.grid2 .hd{display:none}.dos{grid-template-columns:1fr}.dos .hd.e{display:none}.dos .rl{padding-top:12px}}
@media(max-width:600px){.page{padding:20px 16px}h2{font-size:23px}.grid2{grid-template-columns:1fr}.grid2 .hd.e{display:none}.grid2 .rl{padding-top:12px}.def{grid-template-columns:1fr 46px}.def .who{grid-column:1/-1}.book{width:44px;font-size:12px}.shelf{gap:5px;padding:12px 8px 0}}
</style>
</head>
<body>
<header class="top">
  <div class="k">Практикум за текстом трагедії</div>
  <h1>Йоганн Вольфганг Гете. «Фауст»</h1>
  <div class="s">Частина перша · 8 творчих завдань</div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap"><main class="page" id="page"></main></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY='faust_part1_workshop_v1';
var S;try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
S=S||{p:0,a:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function A(k,d){return S.a[k]!==undefined?S.a[k]:d}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}

/* ---------- data ---------- */
var BOOKS=[
 {id:'b1',t:'Філософія',c:'#5b3a29',h:160,q:'Що Фауст каже про філософію у першому монолозі? Чому роки її вивчення не дали йому відповіді?'},
 {id:'b2',t:'Право',c:'#2f4a3a',h:140,q:'Чому знання права не задовольняє Фауста? Що він каже про свої вчені звання і владу над учнями?'},
 {id:'b3',t:'Медицина',c:'#6d2a2a',h:170,q:'Згадай розповідь Фауста під час великодньої прогулянки: чому люди дякують йому з батьком, а він сам вважає себе винним?'},
 {id:'b4',t:'Теологія',c:'#2b3550',h:150,q:'Чому навіть теологія не дає Фаустові спокою? Як він реагує на великодній спів дзвонів і хорів?'},
 {id:'b5',t:'Книга магії',c:'#7a5a12',h:185,q:'Чого Фауст чекає від магії? Що відбувається, коли він викликає Духа Землі, і як це штовхає його до думки про смерть?'}
];
var WORDS=[{id:'w3',t:'Сила'},{id:'w1',t:'Слово'},{id:'w4',t:'Діло'},{id:'w2',t:'Думка'}];
var ROUTE=[
 {id:'r4',t:'Відьомська кухня'},
 {id:'r1',t:'Нічний кабінет Фауста'},
 {id:'r7',t:'Вальпургієва ніч'},
 {id:'r3',t:'Ауербахів льох'},
 {id:'r6',t:'Сад Марти («Гретхен-питання»)'},
 {id:'r2',t:'Великодня прогулянка за міською брамою'},
 {id:'r8',t:'В’язниця'},
 {id:'r5',t:'Вулиця: перша зустріч із Маргаритою'}
];
var MOMENTS=['Перша зустріч на вулиці','Скринька з коштовностями','Ворожіння на квітці в саду («любить — не любить»)','За прядкою («Мій спокій зник…»)','Розмова з Фаустом про віру','Біля криниці: плітки Лізхен','Смерть Валентина','У соборі','У в’язниці'];
var DEF=[{id:'f',t:'Фауст'},{id:'m',t:'Мефістофель'},{id:'g',t:'Маргарита'},{id:'mt',t:'Марта'},{id:'s',t:'Міська громада'}];
var WROWS=[['who','Хто укладає парі / угоду'],['stake','Що поставлено на кін'],['cond','За якої умови виграє Мефістофель'],['view','Яке уявлення про людину стоїть за парі'],['quote','Ключові слова (своїми словами або цитатою)']];

var STAGES=[
 {id:'e1',t:'Учений у відчаї',sc:'«Ніч»: монолог у кабінеті, Дух Землі, чаша з отрутою'},
 {id:'e2',t:'Серед людей',sc:'«Перед міською брамою»: великодня прогулянка, розмова з Вагнером'},
 {id:'e3',t:'Той, хто укладає парі',sc:'«Кабінет»: прокляття, угода з Мефістофелем'},
 {id:'e4',t:'Помолоділий',sc:'«Відьомська кухня», «Вулиця»: дзеркало, зустріч із Маргаритою'},
 {id:'e5',t:'Закоханий і роздвоєний',sc:'«Ліс і печера», «Сад Марти»'},
 {id:'e6',t:'Той, хто прозрів',sc:'«Похмурий день. Поле», «В\u2019язниця»'}
];
var TRAITS=['жага пізнання','відчай','гордість','самотність','бунт','нетерпіння','жага насолод','пристрасть','ніжність','цинізм','сумнів','сором','каяття','відповідальність','безсилля','любов до природи','зневага до людей','співчуття'];
var DOSS=[['look','Вік, вигляд, оточення'],['want','Чого прагне'],['fear','Що його мучить'],['know','Ставлення до знання'],['people','Ставлення до людей'],['meph','Ставлення до Мефістофеля'],['line','Ключова репліка (своїми словами)']];
var PAGES=[
 {t:'Початок',r:pIntro},
 {t:'1. Кабінет',r:p1},
 {t:'2. «На початку було…»',r:p2},
 {t:'3. Два парі',r:p3},
 {t:'4. Маршрут',r:p4},
 {t:'5. Щоденник',r:p5},
 {t:'6. Суд',r:p6},
 {t:'7. Дві душі',r:p7},
 {t:'8. Два портрети',r:p8},
 {t:'Зберегти',r:pEnd}
];

/* ---------- completion ---------- */
function filled(k){var v=S.a[k];return typeof v==='string'&&v.trim().length>3}
function done(i){
 switch(i){
  case 1:return BOOKS.every(function(b){return filled('b_'+b.id)})&&filled('b_poison');
  case 2:return !!S.a.w_touched&&WORDS.every(function(w){return filled('w_'+w.id)})&&filled('w_final');
  case 3:return WROWS.every(function(r){return filled('h_'+r[0])&&filled('s_'+r[0])})&&!!S.a.signed;
  case 4:return !!S.a.r_touched&&ROUTE.every(function(r){return filled('r_'+r.id)});
  case 5:return [0,1,2].every(function(i){return S.a['d_m'+i]&&filled('d_t'+i)});
  case 7:return STAGES.every(function(x){return S.a['soul_'+x.id]!==undefined&&(S.a['tr_'+x.id]||[]).length>0&&filled('pr_'+x.id)})&&filled('soul_final');
  case 8:return DOSS.every(function(r){return filled('o_'+r[0])&&filled('n_'+r[0])})&&filled('same')&&filled('letter');
  case 6:return DEF.every(function(d){return filled('c_'+d.id)})&&!!S.a.verdict&&filled('c_final');
 }return false;
}

/* ---------- shell ---------- */
function tabs(){
 var t=document.getElementById('tabs');
 t.innerHTML=PAGES.map(function(p,i){return '<button data-i="'+i+'" class="'+(i===S.p?'cur ':'')+(done(i)?'done':'')+'">'+p.t+'</button>'}).join('');
 t.querySelectorAll('button').forEach(function(b){b.onclick=function(){go(+b.dataset.i)}});
}
function go(i){S.p=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){return '<div class="btns"><button class="btn ghost" data-go="'+(S.p-1)+'">← Назад</button><button class="btn" data-go="'+(S.p+1)+'">Далі →</button></div>'}
function render(){var el=document.getElementById('page');el.innerHTML=PAGES[S.p].r();bind(el);tabs()}
function bind(el){
 el.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(+b.dataset.go)}});
 el.querySelectorAll('[data-k]').forEach(function(f){f.addEventListener('input',function(){S.a[f.dataset.k]=f.value;save();tabsLight()})});
 if(PAGES[S.p].after)PAGES[S.p].after(el);
}
function tabsLight(){document.querySelectorAll('#tabs button').forEach(function(b){var i=+b.dataset.i;b.classList.toggle('done',done(i))})}
function ta(k,ph,rows){return '<textarea data-k="'+k+'" rows="'+(rows||3)+'" placeholder="'+esc(ph||'')+'">'+esc(A(k,''))+'</textarea>'}
function head(n,title,lead){return '<div class="num">'+n+'</div><h2>'+title+'</h2>'+(lead?'<p class="lead">'+lead+'</p>':'')}

/* ---------- pages ---------- */
function pIntro(){
 return head('Перед початком','Ласкаво просимо до кабінету доктора Фауста','Це не тест: тут немає «правильних кнопок». Важливо, наскільки уважно ти прочитав(-ла) першу частину трагедії й чи вмієш спиратися на текст.')+
 '<label class="q">Прізвище та ім’я</label><input type="text" data-k="name" value="'+esc(A('name',''))+'">'+
 '<label class="q">Група</label><input type="text" data-k="group" value="'+esc(A('group',''))+'">'+
 '<div class="task"><b>Як працювати:</b> виконай 8 завдань у будь-якому порядку (вкладки вгорі). Відповіді зберігаються автоматично в цьому браузері. Наприкінці на вкладці «Зберегти» натисни <b>«Завантажити у Word»</b> і надішли файл викладачці. У кожній відповіді спирайся на конкретні епізоди, репліки чи деталі тексту.</div>'+
 '<div class="btns"><span></span><button class="btn" data-go="1">Розпочати →</button></div>';
}

function p1(){
 var sel=A('b_sel','b1'),b=BOOKS.filter(function(x){return x.id===sel})[0];
 return head('Завдання 1','Полиця доктора Фауста','Фауст «пройшов» усі чотири факультети середньовічного університету, а потім узяв до рук книгу магії.')+
 '<div class="task">Натискай на кожну книгу й відповідай на питання до неї. Книга з відповіддю отримує позначку ✓.</div>'+
